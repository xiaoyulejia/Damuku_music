<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>点歌台设置</title>
    <style>
        html, body, iframe {
            width: 100%;
            height: 100%;
            margin: 0;
            border: 0;
            overflow: hidden;
            background: #11131f;
        }
    </style>
</head>

<body>
    <iframe id="settingsFrame" title="点歌台设置"></iframe>
    <script>
        const frameQuery = new URLSearchParams(window.location.search);
        frameQuery.set('settings', '1');
        document.getElementById('settingsFrame').src = `./?${frameQuery.toString()}`;
    </script>
</body>

</html>
